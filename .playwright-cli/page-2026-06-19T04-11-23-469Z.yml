- generic [ref=e2]: "# Dam Data Japan Open data API for the storage volume, inflow, and outflow of every dam listed in Japan's national reservoir registry. Built from public sources (国土数値情報, ダム便覧, 国土地理院, ja.wikipedia for photo fallback) and republished under permissive terms. Realtime values are not republished. ## What you can do here - Browse 2,749 dams with capacity, location, and operator metadata - Read **historical** storage volume / rate / inflow / outflow at hourly, daily, or monthly granularity - Aggregate by watershed (一級/二級水系) or by prefecture - Pull JSON or CSV — no special protocol, plain HTTP **Not realtime.** This service does not republish live readings. For current-moment values, defer to 川の防災情報 (https://www.river.go.jp/) or the operator's own dashboards. ## Public endpoints - Human site: https://dam.teraren.com/ - HTML API docs (Redoc): https://dam.teraren.com/api/docs - OpenAPI spec: https://dam.teraren.com/api/v1/openapi.json - API catalog (RFC 9727): https://dam.teraren.com/.well-known/api-catalog - Data sources & methodology: https://dam.teraren.com/sources ## Authentication Public read endpoints accept anonymous access via the website. The JSON API under /api/v1 requires an API key issued from /account/keys. Send it as `Authorization: Bearer <key>`. Default quota: 600 req/min, 100,000 req/day. ## Data update cadence - Master (ダム諸元) refresh: monthly from NDI W01 + Damnet - Observations: 1-hour native granularity, ingested in periodic batches from public archives (not realtime). ## Contact - Contact: https://discord.gg/UbWqspWbAk (Discord — no email contact) - Terms: https://dam.teraren.com/legal/terms - Privacy: https://dam.teraren.com/legal/privacy"