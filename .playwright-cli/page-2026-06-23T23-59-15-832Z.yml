              - heading "建設目的" [level=2] [ref=e191]
              - paragraph [ref=e193]: 当別川は、昭和38年より中小河川改修工事、局部改良工事等が行われてきましたが、昭和45年5月の風雨や昭和56年8月の台風12号など、毎年のように河岸の決壊、はんらんを繰り返してきました。
              - heading "昭和56年の洪水被害" [level=3] [ref=e195]
              - paragraph [ref=e197]:
                - img "洪水被害写真" [ref=e198]
              - paragraph [ref=e200]: ダムは、治水（洪水調節）、利水（かんがい・水道用水の供給）、河川環境の保全を目的として建設します。
              - heading "洪水調節" [level=3] [ref=e202]
              - paragraph [ref=e204]: 当別ダムは、抜本的な治水対策を担い、ダム地点の計画高水流量1,220m3/secのうち760m3/secを洪水調節し、当別川沿川地域の洪水被害を防ぐことができます。
              - paragraph [ref=e206]:
                - img "計画高水流量配分図（m3/s）" [ref=e207]
              - paragraph [ref=e209]:
                - img "洪水調節図" [ref=e210]
              - heading "流水の正常な機能の維持" [level=3] [ref=e212]
              - paragraph [ref=e214]: ダムは、ダム地点下流の当別川沿川に既得用水の補給を行う等、川の流量を安定させ、流水の正常な機能（水資源保持機能）維持と増進を図ります。
              - paragraph [ref=e216]:
                - img "流域一覧図" [ref=e217]
              - heading "かんがい用水" [level=3] [ref=e219]
              - paragraph [ref=e221]: 当別町の農業は、稲作を中心とした札幌圏の食糧供給地区としての都市近郊型農業です。肥沃な大地を舞台に、近代化・経営規模の拡大を果たしてきた農地への豊富な水の供給が必要とされています。当別ダムは、当別地区3,194ha (ダム依存分3,153ha)の農地に対し、最大で13.386m3/sec(かんがい期平均8.989m3/sec、年間0.93億m3)のかんがい用水を確保し、沿川の農地に潤いを与え、安定した生産と農業の発展に貢献します。
              - heading "水道用水" [level=3] [ref=e223]
              - generic [ref=e224]:
                - paragraph [ref=e225]:
                  - text: 当別ダムでは、１日最大75,900m3を取水し、浄水処理を経て、石狩西部地域（札幌市※、小樽市、石狩市及び当別町）に１日最大69,000m3の水道用水を供給します。
                  - text: ※小樽市、石狩市及び当別町に対しては平成25年度より水道用水が供給されていますが、札幌市については、令和７年度からの供給開始が予定されております。
                - paragraph [ref=e226]:
                  - text: ★参考（企業団のWebサイト）
                  - link "https://www.ishikariseibu.or.jp/business.html外部のサイトに移動します" [ref=e227] [cursor=pointer]:
                    - /url: https://www.ishikariseibu.or.jp/business.html
                    - text: https://www.ishikariseibu.or.jp/business.html
                    - img "外部のサイトに移動します" [ref=e228]
              - heading "河川環境の保全" [level=3] [ref=e230]
              - paragraph [ref=e232]:
                - text: 川は人の生活はもちろん、植物や昆虫、魚や鳥、さまざまな動物が暮らす場所であり、貴重な生命を支える大切な役割をもっています。川の流量が安定しなかったり、減少したりすると、水質が悪化し、流域環境の生態系にも大きな影響をもたらします。
                - text: 当別ダムでは、川の流量を安定させることで水質の悪化を防ぎ、生態系をはじめとする河川環境の保全に努めます。
              - heading "ダムの形式（台形CSGダム）" [level=2] [ref=e234]
              - heading "1．台形CSGダムとは" [level=3] [ref=e236]
              - paragraph [ref=e238]:
                - text: 今までのダム型式は、築堤材料により大きくコンクリートダムとフィルダムに二分されます。ダム型式は、ダムサイトの地形・地質条件、材料の確保、施工性など総合的な観点から選定され、各々の特性を活かす中で「設計の合理化」、「施工の合理化」が図られてきました。
                - text: しかし、近年の社会情勢、経済情勢の中、ダム建設においては、より一層のコスト縮減、環境への配慮が強く求められています。当別ダムにおいては、基礎掘削により発生する大量の河床砂礫の有効利用を検討する中、国土交通省等で研究開発されている「設計・施工・材料の三つの合理化」を目指した「台形CSGダム」を採用することが、コスト、環境保全の面から最も適正であることが確認されたため、本型式を選定するに至りました。
                - text: 以下、台形CSGダムの特徴について説明します。
              - heading "台形ダムの特徴" [level=4] [ref=e240]
              - paragraph [ref=e242]: 台形ダムは、コンクリートダムで採用される直角三角形の断面形状に対し、堤体積が大きくなりますが、以下に示す大きなメリットを有しています。
              - paragraph [ref=e244]: メリット
              - list [ref=e246]:
                - listitem [ref=e247]: 堤体内に発生する応力が小さいため、強度の小さな材料でも堤体材料として使用することができる。
                - listitem [ref=e248]: 荷重条件の変動に対しても、発生応力の変動を小さく抑えることができる。
                - listitem [ref=e249]: 断面形状が台形形状であるため、転倒や滑動に対する 安全性を高くすることができる。
              - paragraph [ref=e251]:
                - img "台形ダムの特徴を説明する図" [ref=e252]
              - heading "CSGの特徴" [level=4] [ref=e254]
              - paragraph [ref=e256]: 「CSG」は「コンクリート」のように材料を指す用語であり、Cemented Sand and Gravelの頭文字で、直訳すると「セメントで固めた砂礫」となり、河原で取れる砂や砂利、土木工事で発生する岩石などに、セメント、水を加えて練り混ぜ、固めた材料を指します。堤体材料に「CSG」を用いることにより、以下に示すメリットが生まれます。
              - paragraph [ref=e258]: メリット
              - list [ref=e260]:
                - listitem [ref=e261]: 堤体材料として、ダムサイト近傍で容易に入手できる河床砂礫や掘削ズリ（廃棄岩等）を有効活用できるため、原石山の縮小が可能となる。
                - listitem [ref=e262]: 採取した堤体材料は、分級等をせずにそのまま使うため、コンクリートダムのように骨材を製造する設備や、これに伴う濁水処理設備等の設備が不要、もしくは簡素化することができる。
                - listitem [ref=e263]: CSGの打設は、ダンプトラックやブルドーザなどの身近な汎用機械を用いるため、安価で大量・高速施工が可能となる。
              - paragraph [ref=e265]:
                - img "CSGの特徴" [ref=e266]
              - heading "台形CSGダムの特徴" [level=4] [ref=e268]
              - paragraph [ref=e270]: この「台形ダム」と「CSG」の要素を合体させた「台形CSGダム」の特徴は、下図に示すとおり、ダム建設における3つの合理化である「設計の合理化」「材料の合理化」「施工の合理化」を同時に達成可能なダム型式であり、一層のコスト縮減と環境保全への効果を期待することができます。
              - paragraph [ref=e272]:
                - img "台形CSGダムの特徴の図" [ref=e273]
              - heading "2．台形CSGダムを適用するメリット" [level=3] [ref=e275]
              - paragraph [ref=e277]: 当別ダムは、これまで重力式コンクリートダムとして計画されていましたが、 台形CSGダムを適用することにより、以下に示す多くのメリットを有することとなり、コスト縮減が大きく図られることとなります。
              - heading "基礎掘削により発生する土砂をそのまま堤体材料に利用可能" [level=4] [ref=e279]
              - paragraph [ref=e281]: ダム建設予定地には、20m程度の厚さで河床砂礫が堆積しており、基礎掘削に伴い発生する大量の河床砂礫を、そのまま堤体材料として有効利用が可能です。これにより、基礎掘削工事と材料採取工事を兼ねられ、大きくコスト縮減が図られるほか、土捨場への処理量も少なくなり、環境改変への影響を抑えることができます。
              - paragraph [ref=e283]:
                - img "基礎掘削により発生する土砂をそのまま堤体材料に利用可能です。" [ref=e284]
              - heading "大規模な仮設備が不要" [level=4] [ref=e286]
              - paragraph [ref=e288]: ダムでは、基礎掘削より得られる河床砂礫を、分級等をせずにそのまま堤体材料として利用するため、従来のコンクリートダムで計画していた大規模な骨材製造設備等が不要となるほか、これに伴う濁水処理設備も不要となり、大きくコスト縮減が図られます。
              - paragraph [ref=e290]:
                - img "CSG 設備概要図" [ref=e291]
              - heading "施工の簡略化による急速施工が可能" [level=3] [ref=e293]
              - paragraph [ref=e295]: CSG工法は、ダンプトラックやブルドーザなどの汎用機械による施工が可能であり、また、単位セメント量が少ないこと、ブリージングがほとんど発生しないことから、施工継目・グリーンカット等を必要としません。そのため、大量・高速施工が可能となり、従来のコンクリートダム計画よりも工期を短縮することが可能となります。
              - paragraph [ref=e297]:
                - img "CSG工法の状況" [ref=e298]
              - heading "ダムの配置が最短距離で設定可能" [level=3] [ref=e300]
              - paragraph [ref=e302]: 台形CSGダムは滑動や転倒に対する安全性が高く、従来のコンクリートダムに比べ基礎岩盤の適用範囲が広くなります。そのため、堅硬な岩盤なりに屈曲させた従来のコンクリートダム配置計画に対して、地形条件に着目したダム配置が可能となり、堤頂長を最短とすることができます。
              - heading "コンクリートダムの配置および台形CSGダムの配置" [level=4] [ref=e304]
              - paragraph [ref=e306]:
                - img "コンクリートダムの配置および台形CSGダムの配置" [ref=e307]
              - heading "周辺情報" [level=2] [ref=e309]
              - heading "当別ダム周辺マップ" [level=3] [ref=e311]
              - paragraph [ref=e313]:
                - text: ダムが建設される当別町は、札幌市と境界を接し、札幌都心部から約25Kmに位置しています。東西に約13Km、南北約47Km、面積422.71Km2の豊かな緑と大地に恵まれた、美しい田園都市です。
                - text: 管内一の米どころである一方、大都市に隣接する交通の要衝の地として、産業と人の交流も活発です。また、北欧スウェーデンとの独自交流など、文化の香り高い国際交流のまちとして、ますますの発展が期待されています。
              - paragraph [ref=e315]:
                - img "当別ダム周辺マップ" [ref=e316]
