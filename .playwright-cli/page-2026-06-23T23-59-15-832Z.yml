              - heading "概要" [level=2] [ref=e97]
              - heading "事業の概要と経過" [level=3] [ref=e99]
              - paragraph [ref=e101]:
                - text: 当別ダムは、当別川総合開発事業の一環として、石狩川水系当別川の北海道石狩郡当別町字青山十万坪地先に建設した多目的ダムです。
                - text: ダムは、台形CSGダム形式として、高さ52.0m、総貯水量74,500,000立方㎥、有効貯水容量66,500,000㎥で計画されており、洪水調節、流水の正常な機能の維持、かんがい用水および水道水の供給を目的としています。
              - paragraph [ref=e103]:
                - img "事業の経過" [ref=e104]
              - heading "流域の概要" [level=3] [ref=e106]
              - paragraph [ref=e108]:
                - text: 当別川は北海道石狩郡当別町に位置し、その源を暑寒別山系増毛山地の南端、察来山(標高590m)に発し、山間部を南流し、途中一番川、二番川等を合流しながら流下し、石狩川の河口より約15kmの右岸に合流する流域面積309.5km2、流路延長72.5kmの一級河川です。
                - text: 当別川流域は内陸性の気候を示し、地域差はあまりありませんが、降雨量は台風期に多くなっています。そのため台風期には、豪雨により災害が多く発生しています。
                - text: 当別川の水利用は古くから行われ、かんがい用水および水道用水の水源等に利用されています。特に下流部は広大な耕地を有し、道央の穀倉地帯となっており、当別町の市街地は当別川の下流部に形成されています。
                - text: 流域の年平均降水量は約1,500mm、年平均気温は約6℃となっています。
              - heading "地質の概要" [level=3] [ref=e110]
              - paragraph [ref=e112]: 当別ダムは当別町市街の北方約11kmに位置しています。ダムサイトの地質は新第三紀の望来層(シルト岩、砂岩)を基盤として、これを覆って段丘堆積物、崖錐堆積物などが分布しています。
