              - paragraph [ref=e78]:
                - text: 苫前郡初山別村字有明地先に建設されたダムです。洪水を調節し、ダム下流域の水害を防除するとともに、下流既得用水の補給及び河川環境の保全等のための流量を確保します。
                - text: 当ダムは「治水ダム建設事業費補助制度」による、北海道で初めてのダムです。
              - heading "諸元" [level=3] [ref=e80]
              - paragraph [ref=e82]:
                - text: 名称：有明ダム（ 愛称 第一カッター 有明ダム）
                - text: 貯水池名：東山湖
                - text: 河川名：2級河川茂築別川水系茂築別川
                - text: 型式：重力式コンクリート
                - text: 堤高：21.7m
                - text: 堤頂長：250m
                - text: 総貯水容量：2,440,000㎥
                - text: しゅん工年：昭和47年
