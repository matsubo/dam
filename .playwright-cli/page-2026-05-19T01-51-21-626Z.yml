                - generic [ref=e255]: 印鑑のコア要件である「ユニークネス」は、100 円ショップの三文判が普及した頃から形骸化している。既存の無料 Web サービスも入力が同じなら全員同じ印影で、本来の意味の印鑑になっていない。一方ハンコ屋でオリジナル印影を彫ると 4,000 円〜。この「無料 = 形骸化した印鑑」「本来の印鑑 = 有料」というギャップを、URL に状態を全部詰め込んで巨大な名前空間で「生成元の証明可能性」を担保する形で埋めた SPA の開発記録。React 19 + 純粋関数 3 層パイプライン、URL を Single Source of Truth にする base64url バイナリエンコーディング、SVG + Canvas の決定的レンダリング、Coolify デプロイ、苗字ランキング × SEO ランディング。
