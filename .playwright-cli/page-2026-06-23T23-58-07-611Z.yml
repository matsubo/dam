              - heading "様似ダムの概要" [level=2] [ref=e84]
              - heading "様似治水ダム建設事業" [level=3] [ref=e86]
              - paragraph [ref=e88]: 様似川は北海道の南端襟裳岬の西方に位置し、北海道の背梁日高山脈を源として南流して太平洋に注ぐ流路延長22.3km、流域面積83.6kmの二級河川です。
              - paragraph [ref=e90]:
                - text: 様似ダムは様似川水系様似川の北海道様似郡様似町字新富地先に昭和50年に完成しました。
                - text: ダムは重力式コンクリートダムであり、高さ44.0m、総貯水容量 6,200,000 m3、
                - text: 有効貯水量 4,910,000m3で洪水調節を目的とします。
              - heading "事業の大要" [level=3] [ref=e92]
              - paragraph [ref=e94]:
                - text: ダム地点の計画高水流量 580 m3/s のうち356 m3/s の洪水を調節し、ダム下流域の水害を防除します。
                - text: 昭和54年度から58年度にかけてダム周辺の環境整備が実施され、昭和61年度から平成2年度にかけては
                - text: 管理施設改良のため堰堤改良事業が行われました。
                - text: また、平成5年度から平成11年度にかけては水環境改善事業により魚道を設置しました。
