//現在時刻の取得
function getNowTime(){
	obj = new Date();
	yy = obj.getYear();
	mm = obj.getMonth() + 1;
	dd = obj.getDate();
	hh = obj.getHours()
	nn = obj.getMinutes()

	if (yy < 2000) { yy += 1900; }
	if (mm < 10) { mm = "0" + mm; }
	if (dd < 10) { dd = "0" + dd; }
	if (hh < 10) { hh = "0" + hh; }
	if (nn < 10) { nn = "00"; }

	 else if (nn < 30)  { nn = "20"; }
	 else if (nn < 40)  { nn = "30"; }
	 else if (nn < 50)  { nn = "40"; }
	 else if (nn < 60)  { nn = "50"; }
	str = yy + "/" + mm + "/" + dd + " " + hh + ":" + nn;

	return str;
}
