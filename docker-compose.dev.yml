name: dam

services:
  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: dam
    ports: ['${DB_PORT:-5432}:5432']
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dam -d dam']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
