name: Release

# Pushing a vX.Y.Z tag (made by `just version-bump`) publishes the GitHub
# Release for it, with that version's OpenAPI document attached.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile

      # The root package.json is the single source of the version; a tag that
      # disagrees with it would publish a release whose API says otherwise.
      - name: Check the tag matches package.json
        run: |
          version="$(bun pm pkg get version | tr -d '"')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: bun run apps/web/bin/export_openapi.ts "openapi-$TAG.json"

      # Re-running the job (or a release drafted by hand first) must not fail,
      # so an existing release only gets its asset replaced.
      - name: Publish the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "openapi-$TAG.json" --clobber
          else
            gh release create "$TAG" "openapi-$TAG.json" --generate-notes --verify-tag
          fi
