name: Deploy to k3s

# Build the web and worker images, push them to GHCR, then join the home
# tailnet and roll them out to the k3s cluster (t1/t2/t3). Public traffic
# reaches the cluster through the in-cluster Cloudflare tunnel; nothing here is
# exposed to the internet.
#
# The roll-out job only runs while the repository variable DEPLOY_K3S is
# `true`. It is a switch for moves of the database: with it unset, pushes keep
# building images but leave namespace dam alone.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-k3s
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push ghcr.io/matsubo/dam-web and dam-worker

env:
  IMAGE_WEB: ghcr.io/matsubo/dam-web
  IMAGE_WORKER: ghcr.io/matsubo/dam-worker

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NEXT_PUBLIC_* are inlined into the client bundle at build time.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.web
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://dam.teraren.com
            NEXT_PUBLIC_GTM_ID=GTM-KKX548LX
          tags: |
            ${{ env.IMAGE_WEB }}:${{ github.sha }}
            ${{ env.IMAGE_WEB }}:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          tags: |
            ${{ env.IMAGE_WORKER }}:${{ github.sha }}
            ${{ env.IMAGE_WORKER }}:main
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  deploy:
    needs: build
    if: vars.DEPLOY_K3S == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Joins as an ephemeral tag:ci node, which the tailnet policy lets reach
      # only the Tailscale Service svc:k3s-api (100.86.55.136:6443, the server
      # in KUBECONFIG); the tailnet's DNS is out of reach, so the runner keeps
      # its own resolver (--accept-dns=false).
      #
      # The tailnet runs Tailnet Lock (since 2026-10-26): a node created through
      # the OIDC trust credential is unsigned, `tailscale up` succeeds, and
      # kubectl then times out on 100.86.55.136:6443. TS_AUTHKEY is an auth key
      # (tag:ci, reusable, ephemeral, pre-approved) signed with a trusted
      # Tailnet Lock key; it expires 2027-01-26. Renewal: docs/llm/RUNBOOK.md
      # "Deploy".
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          statedir: /tmp/tailscale-state/
          args: --accept-dns=false

      # kubectl comes with the ubuntu-latest runner image.

      # KUBECONFIG is the dam/deployer ServiceAccount: it can manage the
      # Deployments, Service, Ingress, PodDisruptionBudget and the CDN purge
      # Job in namespace dam, and cannot read Secrets.
      - name: Roll out
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          sed -e "s|image: IMAGE_WEB$|image: $IMAGE_WEB:$GITHUB_SHA|" \
              -e "s|image: IMAGE_WORKER$|image: $IMAGE_WORKER:$GITHUB_SHA|" \
              deploy/k8s.yaml | kubectl apply -f -
          kubectl -n dam rollout status deploy/dam-web --timeout=900s
          kubectl -n dam rollout status deploy/dam-worker --timeout=300s

      # Drop the CDN copies of the old build.
      - name: Purge the CDN
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          kubectl -n dam delete job dam-purge-cdn --ignore-not-found --wait
          sed "s|image: IMAGE_WEB$|image: $IMAGE_WEB:$GITHUB_SHA|" deploy/purge-cdn.yaml | kubectl apply -f -
          kubectl -n dam wait --for=condition=complete job/dam-purge-cdn --timeout=300s
          kubectl -n dam logs job/dam-purge-cdn
