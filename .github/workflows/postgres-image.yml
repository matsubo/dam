name: PostgreSQL image

# Builds deploy/postgres/Dockerfile (the CloudNativePG operand image for the
# database: PostgreSQL 16 + TimescaleDB TSL + toolkit + PostGIS), checks that
# every extension loads at its pinned version, and pushes it to GHCR from
# main. The cluster (matsubo/network-setting, k8s/dam.yaml) pins it by digest,
# so a push here changes nothing until that file is updated. The digest is in
# the job summary.

on:
  push:
    paths:
      - deploy/postgres/**
      - .github/workflows/postgres-image.yml
  workflow_dispatch:

concurrency:
  group: postgres-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push ghcr.io/matsubo/dam-postgres

env:
  IMAGE: ghcr.io/matsubo/dam-postgres
  # The tag starts with the PostgreSQL version: CloudNativePG reads the major
  # version from it.
  PG_VERSION: '16.15'
  TIMESCALEDB_VERSION: 2.26.4
  TOOLKIT_VERSION: 1.22.0
  POSTGIS_VERSION: 3.6.3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          tag="$PG_VERSION-ts$TIMESCALEDB_VERSION-tk$TOOLKIT_VERSION-postgis$POSTGIS_VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$tag-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Built into the local Docker engine first, so the smoke test runs on
      # exactly the image that is pushed afterwards.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres

      - name: Smoke test
        run: |
          docker run --rm \
            -e TIMESCALEDB_VERSION -e TOOLKIT_VERSION -e POSTGIS_VERSION \
            -v "$PWD/deploy/postgres/smoke-test.sh:/smoke-test.sh:ro" \
            "$IMAGE:${{ steps.tags.outputs.tag }}" bash /smoke-test.sh

      - name: Push
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:${{ steps.tags.outputs.tag }}"
          docker push "$IMAGE:${{ steps.tags.outputs.sha_tag }}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ steps.tags.outputs.sha_tag }}")"
          echo "Pushed \`$IMAGE:${{ steps.tags.outputs.sha_tag }}\` = \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
