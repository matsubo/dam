# pgBackRest configuration for the dam Postgres instance.
#
# Strategy: weekly full + hourly differential to an external S3 bucket
# (NOT the same MinIO instance the app uses for raw snapshots — back up to a
# separately-managed bucket so a single-host failure doesn't kill both copies).
#
# Secrets are intentionally placeholders. In production they are injected as
# environment variables by Coolify and substituted at container start by an
# init script (or by mounting this file as a template and rendering it with
# `envsubst`). Required env vars:
#
#   PGBACKREST_S3_BUCKET      e.g. dam-backup
#   PGBACKREST_S3_ENDPOINT    e.g. s3.us-east-1.amazonaws.com
#                             (or your provider's host, no scheme, no path)
#   PGBACKREST_S3_REGION      e.g. us-east-1
#   PGBACKREST_S3_KEY         access key id
#   PGBACKREST_S3_SECRET      secret access key
#   PGBACKREST_CIPHER_PASS    32+ random bytes; rotate independently of S3 creds
#
# See deploy/ops/runbook.md for backup/restore procedures.

[global]
repo1-type=s3
repo1-s3-bucket=PGBACKREST_S3_BUCKET_PLACEHOLDER
repo1-s3-endpoint=PGBACKREST_S3_ENDPOINT_PLACEHOLDER
repo1-s3-region=PGBACKREST_S3_REGION_PLACEHOLDER
repo1-s3-key=PGBACKREST_S3_KEY_PLACEHOLDER
repo1-s3-key-secret=PGBACKREST_S3_SECRET_PLACEHOLDER
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=PGBACKREST_CIPHER_PASS_PLACEHOLDER
repo1-retention-full=4
repo1-retention-diff=14

# Logging — visible via `docker logs` on the pgbackrest sidecar.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# Allow multi-CPU compression. Adjust based on the host's available cores.
process-max=2
compress-type=zst
compress-level=3

# Start a backup even if the previous one was aborted (e.g. by a redeploy).
start-fast=y

[main]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=dam
pg1-database=dam
