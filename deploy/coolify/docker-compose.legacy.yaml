# LEGACY single-resource stack (kept for reference and rollback only).
#
# Until 2026-09-11 production ran this file as ONE Coolify "Docker Compose"
# resource (frd6so0qmtknwe7kogjyalkw). Coolify cannot roll-update compose
# resources, so every push removed app+worker+db+minio and took the site down
# for ~70 s (#30). Production now runs four Coolify resources — see README.md
# in this directory. Nothing deploys this file any more.
#
# Rollback: the old resource still exists (stopped, auto-deploy off) with its
# original volumes frd6so0qmtknwe7kogjyalkw_db-data / _minio-data. Point its
# "Docker Compose Location" at this file and start it.
#
# Required Coolify-managed environment variables (set in the UI, NOT here):
#   - POSTGRES_PASSWORD
#   - S3_ACCESS_KEY / S3_SECRET_KEY
#   - API_KEY_PEPPER          (32+ random bytes, used by bin/api_key.ts)
#   - KASENBOSAI_USER_AGENT   (contact email per upstream's TOS)
#
# Optional:
#   - NEXT_PUBLIC_SITE_URL    (canonical URL, used by sitemap.ts / robots.ts)

name: dam

services:
  app:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dam:${POSTGRES_PASSWORD}@db:5432/dam
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-dam-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      # Reference SERVICE_FQDN_APP_3000 so Coolify auto-generates Traefik
      # labels routing the configured FQDN to this service on port 3000.
      # (Set the env var "SERVICE_FQDN_APP_3000=https://dam.teraren.com" in Coolify.)
      NEXT_PUBLIC_SITE_URL: ${SERVICE_FQDN_APP_3000:-${NEXT_PUBLIC_SITE_URL:-}}
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # bun image has no curl/wget; use bun's built-in fetch.
      test:
        - 'CMD-SHELL'
        - "bun -e \"fetch('http://127.0.0.1:3000/api/v1/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Coolify will inject SERVICE_FQDN_APP_3000 to expose this on the public URL.
    expose:
      - '3000'
    # Explicit Traefik labels routing dam.teraren.com → app:3000. Coolify
    # auto-generates labels for the sslip.io fallback host; these add a
    # parallel router for the public domain. Single HTTP entrypoint is
    # sufficient because Cloudflare terminates TLS in front of Coolify.
    labels:
      - traefik.enable=true
      - traefik.http.routers.dam-app.rule=Host(`dam.teraren.com`)
      - traefik.http.routers.dam-app.entrypoints=http
      - traefik.http.routers.dam-app.service=dam-app
      - traefik.http.services.dam-app.loadbalancer.server.port=3000

  worker:
    build:
      context: .
      dockerfile: deploy/coolify/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://dam:${POSTGRES_PASSWORD}@db:5432/dam
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-dam-raw}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      KASENBOSAI_USER_AGENT: ${KASENBOSAI_USER_AGENT}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    # No public port — worker has no HTTP surface. No healthcheck either:
    # the bun runtime image doesn't include `pgrep`/`procps`, and graphile-worker
    # already exits non-zero on fatal errors → `restart: unless-stopped` covers it.

  db:
    # `:pg16-all` bundles TimescaleDB + PostGIS + pg_trgm + pgcrypto, all required
    # by 0000_extensions.sql. The bare `:pg16` tag does NOT include PostGIS.
    image: timescale/timescaledb-ha:pg16-all
    restart: unless-stopped
    environment:
      POSTGRES_DB: dam
      POSTGRES_USER: dam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/home/postgres/pgdata/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dam -d dam']
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  db_data:
  minio_data:
